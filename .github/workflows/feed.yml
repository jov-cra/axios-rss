name: Build filtered Axios feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min; adjust to taste
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: axios-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build filtered feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # add this secret in repo Settings
          AX_MODEL: "claude-haiku-4-5-20251001"                 # cheapest model
          AX_TITLE: "Axios (no Politics)"
          AX_FEED_SELF: "https://jov-cra.github.io/axios-rss/feed.xml"
        run: python axios_filter.py
      - name: Commit feed + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update filtered Axios feed [skip ci]"
            git push
          fi

      - name: Open an issue when the build fails
        # A red scheduled run is otherwise invisible: the last good feed keeps
        # being served, so the reader looks healthy while the feed goes stale.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Feed build is failing"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" \
              --body "The scheduled feed build failed and left the previous feed.xml in place (fail-closed), so the published feed is now going stale. Run: $RUN_URL"
          fi
